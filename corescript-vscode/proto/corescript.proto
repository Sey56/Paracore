syntax = "proto3";

package CoreScript;

service CoreScriptRunner {
  rpc ExecuteScript (ExecuteScriptRequest) returns (ExecuteScriptResponse);
  rpc GetStatus (GetStatusRequest) returns (GetStatusResponse);
  rpc GetScriptMetadata (GetScriptMetadataRequest) returns (GetScriptMetadataResponse);
  rpc GetScriptParameters (GetScriptParametersRequest) returns (GetScriptParametersResponse);
  rpc GetCombinedScript (GetCombinedScriptRequest) returns (GetCombinedScriptResponse);
  rpc GetBulkMetadata (GetBulkMetadataRequest) returns (GetBulkMetadataResponse);
  rpc GetContext (GetContextRequest) returns (GetContextResponse);
  rpc CreateAndOpenWorkspace (CreateWorkspaceRequest) returns (CreateWorkspaceResponse);
  rpc GetScriptManifest (GetScriptManifestRequest) returns (GetScriptManifestResponse);
  rpc ValidateWorkingSet (ValidateWorkingSetRequest) returns (ValidateWorkingSetResponse);
  rpc ComputeParameterOptions (ComputeParameterOptionsRequest) returns (ComputeParameterOptionsResponse);
  rpc SelectElements (SelectElementsRequest) returns (SelectElementsResponse);
  rpc PickObject (PickObjectRequest) returns (PickObjectResponse);
  rpc RenameScript (RenameScriptRequest) returns (RenameScriptResponse);
  rpc BuildScript (BuildScriptRequest) returns (BuildScriptResponse);
  rpc GetCategoryParameters (GetCategoryParametersRequest) returns (GetCategoryParametersResponse);
  rpc GetModelCategories (GetModelCategoriesRequest) returns (GetModelCategoriesResponse);
  rpc StopSyncSession (StopSyncSessionRequest) returns (StopSyncSessionResponse);
  rpc GetWatchdogStatus (GetWatchdogStatusRequest) returns (GetWatchdogStatusResponse);
  rpc RegisterWatchdogSource (RegisterWatchdogSourceRequest) returns (RegisterWatchdogSourceResponse);
  rpc UnregisterWatchdogSource(UnregisterWatchdogSourceRequest) returns (UnregisterWatchdogSourceResponse);
  rpc UpdateElementParameter (UpdateElementParameterRequest) returns (UpdateElementParameterResponse);
  // New V4 Data Grid Feature: Mass Single-Transaction Edit
  rpc BatchUpdateElementParameters(BatchUpdateElementParametersRequest) returns (BatchUpdateElementParametersResponse);
  rpc ClearAssemblyCache (ClearAssemblyCacheRequest) returns (ClearAssemblyCacheResponse);
  rpc ExecuteRepl (ExecuteReplRequest) returns (ExecuteReplResponse);
  // IntelliSense for the REPL playground. Read-only: it compiles the buffer in an
  // in-memory Roslyn workspace and returns completions. It never executes the code.
  rpc GetReplCompletions (GetReplCompletionsRequest) returns (GetReplCompletionsResponse);
  // Red squiggles for the REPL playground. Read-only, same workspace, same contract:
  // compiles the buffer and returns warnings/errors in the buffer's own coordinates.
  rpc GetReplDiagnostics (GetReplDiagnosticsRequest) returns (GetReplDiagnosticsResponse);
  // Symbol hover for the REPL playground. Read-only, same workspace: resolves the symbol
  // under the caret and returns its signature and XML documentation.
  rpc GetReplHover (GetReplHoverRequest) returns (GetReplHoverResponse);
}

// Internal service for the Revit Add-in to talk to the Sidecar
service AddinBridge {
  // Add-in calls this to receive tasks from the Sidecar
  rpc Subscribe (SubscribeRequest) returns (stream TaskEnvelope);
  // Add-in calls this to submit the result of a task
  rpc SubmitResult (TaskResult) returns (SubmitResultResponse);
}

message SubscribeRequest {
  string addin_version = 1;
}

message SubmitResultResponse {
  bool accepted = 1;
}

message TaskEnvelope {
  string task_id = 1;
  string method_name = 2; // e.g. "ExecuteScript", "GetContext"
  bytes payload_json = 3; // The request serialized as JSON for maximum flexibility
}

message TaskResult {
  string task_id = 1;
  bool is_success = 2;
  bytes result_json = 3;
  string error_message = 4;
}


message ClearAssemblyCacheRequest {}

message ClearAssemblyCacheResponse {
  bool is_success = 1;
  string message = 2;
}

message UnregisterWatchdogSourceRequest {
  string path = 1;
}

message UnregisterWatchdogSourceResponse {
  bool is_success = 1;
  string error_message = 2;
  int32 watchdogs_removed = 3;
}

message RegisterWatchdogSourceRequest {
  string path = 1;
  bytes parameters_json = 2;
}

message RegisterWatchdogSourceResponse {
  bool is_success = 1;
  string error_message = 2;
  int32 watchdogs_registered = 3;
  repeated string load_details = 4;
}

message GetWatchdogStatusRequest {}

message WatchdogStatus {
  string script_path = 1;
  string script_name = 2;
  string summary = 3;
  string status = 4;
  string details_json = 5;
  string timestamp = 6;
  string parameters_json = 7;
}

message FailedWatchdog {
  string script_path = 1;
  string script_name = 2;
  string error_message = 3;
  string timestamp = 4;
}

message GetWatchdogStatusResponse {
  repeated WatchdogStatus watchdogs = 1;
  repeated FailedWatchdog failed_watchdogs = 2;
}

message StopSyncSessionRequest {
  string script_path = 1;
}

message StopSyncSessionResponse {
  bool is_success = 1;
  string error_message = 2;
}

message GetCategoryParametersRequest {
  string category_name = 1; 
}

message ParameterDefinition {
  string name = 1;
  string storage_type = 2; 
  bool is_builtin = 3;
  int32 builtin_id = 4; 
  string revit_element_type = 5; 
  string builtin_name = 6;
  string spec_type_id = 7;
  bool is_type = 8;
}

message GetCategoryParametersResponse {
  repeated ParameterDefinition parameters = 1;
  string error_message = 2;
}

message GetModelCategoriesRequest {}

message GetModelCategoriesResponse {
  repeated CategoryInfo categories = 1;
  string error_message = 2;
}

message CategoryInfo {
  string id = 1;
  string label = 2;
}

message PickObjectRequest {
  string selection_type = 1; 
  string category_filter = 2; 
}

message PickObjectResponse {
  string value = 1; 
  bool is_success = 2;
  bool cancelled = 3;
  string error_message = 4;
}

message SelectElementsRequest {
  repeated int64 element_ids = 1;
}

message SelectElementsResponse {
  bool is_success = 1;
  string error_message = 2;
}

message CreateWorkspaceRequest {
  string script_path = 1;
}

message CreateWorkspaceResponse {
  string workspace_path = 1;
  string error_message = 2;
}

message ScriptFile {
  string file_name = 1;
  string content = 2;
}

message ExecuteScriptRequest {
  string script_content = 1;
  bytes parameters_json = 2;
  string source = 3;
  bytes compiled_assembly = 4; 
  string license_tier = 5;
}

message StructuredOutputItem {
  string type = 1;
  string data = 2; 
  string title = 3; 
  // ⚠ ADDITIVE (field 4, 2026-10-27). true = "every row matters, do not truncate". The MCP
  //   summariser caps a table at 50 rows; that is right for an element dump and wrong for a
  //   PARAMETER SCHEMA, where the list is the answer. proto3 default false means an older
  //   add-in simply keeps the old behaviour — no version negotiation needed.
  bool cap_exempt = 4;
}

message ExecuteScriptResponse {
  bool is_success = 1;
  string output = 2;
  string error_message = 3;
  repeated string error_details = 4;
  repeated StructuredOutputItem structured_output = 5;
  string internal_data = 6;
  string agent_summary = 7;
  repeated int32 pipeline_diagnostics = 8;
  bool user_rejected = 9;        // session gate: user clicked Reject
  // Who satisfied the [Confirm("WORD")] gate for this run — so a caller can tell a run a
  // PERSON approved from a run with no gate at all. Values:
  //   ""               the gate was never reached (the run failed before it)
  //   "not_required"   the script declares no [Confirm]
  //   "not_agent_run"  not an agent run, so no dialog was involved
  //   "dry_run_exempt" a dry run — the engine's gate exempts dry runs by design
  //   "user_confirmed" an agent run; a person typed the word in the Revit dialog
  //   "user_declined"  an agent run; the person declined (user_rejected is also true)
  //   "unavailable"    the [Confirm] requirements could not be read; the run was refused
  string confirmation = 10;
  // ── Session gate: WHO answered "may an AI agent execute code in this Revit session?" ──
  //   Reported on EVERY response, because "a person allowed this" and "there was no gate
  //   at all" are otherwise indistinguishable to the caller — the same ambiguity the
  //   `confirmation` field above was added to remove, one gate over. Values:
  //     ""                the gate was never reached (the run failed before it)
  //     "not_required"    not an agent run (manual REPL / Gallery / Playlist)
  //     "granted"         the dialog was shown THIS call and a person clicked Allow
  //     "already_granted" a person allowed it earlier in this session (no dialog this call)
  //     "denied"          a person clicked Block — nothing executed
  string session_consent = 11;
}

message GetStatusRequest {
}

message GetStatusResponse {
  bool paracore_connected = 1;
  bool revit_open = 2;
  string revit_version = 3;
  bool document_open = 4;
  string document_title = 5;
  string document_type = 6;
  string revit_install_path = 7;
  string addin_server_path = 8;
  // ⚠ RECONCILED 2026-10-07 — this field was already declared by the generated Python stub
  // (corescript_pb2.py) and already READ by rap-server/server/api/status_router.py, but it was
  // missing here. Regenerating the stub from this file would have silently dropped it. The
  // proto is the authority; the stub and the consumer agreed with each other and not with it.
  bool is_pro = 9;

  // ⚠⚠ THE SESSION GATE, READABLE WITHOUT ASKING FOR CODE EXECUTION (2026-10-25).
  //   The gate latches ONCE per Revit session and covers EVERY agent — gen, model,
  //   family, forge — but each MCP process can otherwise only learn it from a response
  //   it happens to receive. Without this field a SECOND MCP starts out believing the
  //   session is ungated, caps its first call as if a consent dialog might appear, and
  //   then blames the dialog for a timeout that was really a long automation.
  //   Values mirror SessionGate.SessionConsent: "unsettled" (no decision yet) /
  //   "granted" / "denied". A non-agent caller sees the same value — the state is a
  //   property of the SESSION, not of the caller.
  //   ⚠ GetStatus must stay OFF the Revit UI thread: it is queried WHILE a consent
  //   dialog is modal, so a UI-thread hop would block behind the dialog it reports.
  string session_consent = 10;
}

message GetScriptMetadataRequest {
  repeated ScriptFile script_files = 1;
}

message GetScriptMetadataResponse {
  ScriptMetadata metadata = 1;
  string error_message = 2;
}

message GetScriptParametersRequest {
  repeated ScriptFile script_files = 1;
}

message ScriptMetadata {
  string name = 1;                  
  string file_path = 2;             
  string description = 4;
  string author = 5;
  repeated string categories = 6;
  repeated string dependencies = 7;
  string document_type = 8;
  repeated string usage_examples = 9;        
  string website = 10; 
  string last_run = 11;
  bool is_protected = 12;           
  bool is_compiled = 13;            
  bool is_watchdog = 14;
  string date_created = 15;
  string date_modified = 16;
}


message GetScriptParametersResponse {
  repeated ScriptParameter parameters = 1;
  string error_message = 2;
}

message ScriptParameter {
  string name = 1;
  string type = 2;
  string default_value_json = 3;
  string description = 4;
  repeated string options = 5;
  bool multi_select = 6;
  string visible_when = 7;
  
  string numeric_type = 8;  
  optional double min = 9;
  optional double max = 10;
  optional double step = 11;
  
  bool is_revit_element = 12;
  string revit_element_type = 13;
  string revit_element_category = 14;
  bool requires_compute = 15;
  string group = 16;
  string input_type = 17;
  bool required = 18;
  string suffix = 19;
  string pattern = 20;
  string enabled_when_param = 21;
  string enabled_when_value = 22;
  string unit = 23;
  string selection_type = 24;
  // Extension list declared by [InputFile("csv,txt")] / [OutputFile("pdf")], e.g. "pdf".
  // Carried to the UI so the file dialog offers the right "Save as type" filter.
  string filter = 25;
}

message GetBulkMetadataRequest {
  repeated ScriptProjectFiles projects = 1;
}

message ScriptProjectFiles {
  string project_name = 1;
  string absolute_path = 2;
  repeated ScriptFile files = 3;
}

message GetBulkMetadataResponse {
  repeated ScriptMetadataResponse project_metadata = 1;
}

message ScriptMetadataResponse {
  string project_name = 1;
  string absolute_path = 2;
  ScriptMetadata metadata = 3;
  repeated ScriptParameter parameters = 4;
  string error_message = 5;
}

message GetCombinedScriptRequest {
  repeated ScriptFile script_files = 1;
  string script_path = 2; 
}

message GetCombinedScriptResponse {
  string combined_script = 1;
  string error_message = 2;
}

message GetContextRequest {}

message GetContextResponse {
  string active_view_name = 1;
  int32 selection_count = 2;
  repeated int32 selected_element_ids = 3;
  ProjectInfo project_info = 4;
  string active_view_type = 5;
  int32 active_view_scale = 6;
  string active_view_detail_level = 7;
  repeated ElementInfo selected_elements = 8;
  repeated LevelInfo levels = 9;
}

message LevelInfo {
  int32 id = 1;
  string name = 2;
  double elevation = 3;
}

message ElementInfo {
  int32 id = 1;
  string category = 2;
}

message ProjectInfo {
  string name = 1;
  string number = 2;
  string title = 3;
  string file_path = 4;
  bool is_workshared = 5;
  string username = 6;
}

message GetScriptManifestRequest {
  string script_path = 1;
}

message GetScriptManifestResponse {
  string manifest_json = 1;
  string error_message = 2;
}

message ValidateWorkingSetRequest {
  repeated int64 element_ids = 1;
}

message ValidateWorkingSetResponse {
  repeated int64 valid_element_ids = 1;
}

message ComputeParameterOptionsRequest {
  string script_content = 1;
  string parameter_name = 2;
  bytes parameters_json = 3;
}

message ComputeParameterOptionsResponse {
  repeated string options = 1;
  bool is_success = 2;
  string error_message = 3;
  
  optional double min = 4;
  optional double max = 5;
  optional double step = 6;
}

message RenameScriptRequest {
  string old_path = 1;       
  string new_name = 2;       
}

message RenameScriptResponse {
  bool is_success = 1;
  string new_path = 2;       
  string error_message = 3;
}

message BuildScriptRequest {
  string script_content = 1;
}

message BuildScriptResponse {
  bool is_success = 1;
  bytes compiled_assembly = 2;
  string error_message = 3;
}

message ParameterUpdateItem {
  int32 element_id = 1;
  string parameter_name = 2;
  string new_value_string = 3;
  string unit = 4;
}

message BatchUpdateElementParametersRequest {
  repeated ParameterUpdateItem updates = 1;
}

message BatchUpdateElementParametersResponse {
  bool is_success = 1;
  string error_message = 2;
  int32 count = 3;
}

message UpdateElementParameterRequest {
  int64 element_id = 1;
  string parameter_name = 2;
  string new_value_string = 3;
  string unit = 4;
}

message UpdateElementParameterResponse {
  bool is_success = 1;
  string error_message = 2;
}

message ExecuteReplRequest {
  string code = 1;
  string session_id = 2;
  string license_tier = 3;
  string execution_mode = 4;  // "read_only" or "read_write" (default)
  string source = 5;          // "mcp_agent", "paracore_agent", "paracore_ui"
}

message ExecuteReplResponse {
  bool is_success = 1;
  string output = 2;
  string error_message = 3;
  repeated StructuredOutputItem structured_output = 4;
  repeated int32 pipeline_diagnostics = 5;
  bool user_rejected = 6;        // session gate: user clicked Reject
  bool read_only_violation = 7;  // read_only code contained write operations
  string session_consent = 8;    // session gate — see ExecuteScriptResponse.session_consent
}

// ---------------------------------------------------------------------------
// REPL IntelliSense (completion). Read-only — compiles the buffer in an
// in-memory Roslyn workspace, never executes it.
// ---------------------------------------------------------------------------

message GetReplCompletionsRequest {
  string code = 1;           // the raw REPL buffer, exactly as typed
  int32 caret_offset = 2;    // caret position WITHIN `code` (not the wrapped text)
  string session_id = 3;     // parity with ExecuteRepl; unused by completion today
}

message ReplCompletionItem {
  string label = 1;          // text shown in the completion list
  string insert_text = 2;    // text the editor should insert
  string kind = 3;           // Roslyn tag: Method, Property, Class, …
  string detail = 4;         // short inline description, when supplied
  string sort_text = 5;      // provider-supplied ordering key
}

message GetReplCompletionsResponse {
  bool is_success = 1;
  repeated ReplCompletionItem items = 2;
  string error_message = 3;
}

// ---------------------------------------------------------------------------
// REPL IntelliSense (diagnostics / red squiggles). Read-only — compiles the
// buffer in the same in-memory workspace as completion, never executes it.
// ---------------------------------------------------------------------------

message GetReplDiagnosticsRequest {
  string code = 1;           // the raw REPL buffer, exactly as typed
  string session_id = 2;     // parity with ExecuteRepl; unused today
}

message ReplDiagnostic {
  int32 start_line = 1;      // 1-based, in the USER's buffer coordinates
  int32 start_column = 2;    // 1-based
  int32 end_line = 3;        // 1-based
  int32 end_column = 4;      // 1-based
  string message = 5;
  string severity = 6;       // "Error", "Warning", …
}

message GetReplDiagnosticsResponse {
  bool is_success = 1;
  repeated ReplDiagnostic items = 2;
  string error_message = 3;
}

// ---------------------------------------------------------------------------
// REPL IntelliSense (hover). Read-only — resolves the symbol under the caret in
// the same in-memory workspace as completion and diagnostics, never executes it.
// ---------------------------------------------------------------------------

message GetReplHoverRequest {
  string code = 1;           // the raw REPL buffer, exactly as typed
  int32 caret_offset = 2;    // caret position WITHIN `code` (not the wrapped text)
  string session_id = 3;     // parity with ExecuteRepl; unused by hover today
}

message ReplHoverInfo {
  string signature = 1;      // e.g. "IEnumerable<object> GetFinishingTakeoff()"
  string documentation = 2;  // the XML <summary> as plain text; empty when undocumented
  string kind = 3;           // Roslyn tag: Method, Property, Class, …
  // The span of the symbol in the USER's buffer coordinates (1-based), so the editor
  // can highlight exactly the token the tooltip describes.
  int32 start_line = 4;
  int32 start_column = 5;
  int32 end_line = 6;
  int32 end_column = 7;
}

message GetReplHoverResponse {
  bool is_success = 1;
  // Unset when there is nothing to show at the caret — which is the ordinary case over
  // whitespace. `is_success` stays true: "no symbol here" is an answer, not a failure.
  ReplHoverInfo info = 2;
  string error_message = 3;
}
