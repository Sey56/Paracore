[project]
name = "server"
version = "0.1.0"
description = "Paracore rap-server — FastAPI backend for Paracore desktop app"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.121.0",
    "grpcio>=1.76.0",
    "httpx>=0.28.1",
    "mcp>=1.25.0",
    "protobuf>=6.33.0",
    "pydantic[email]>=2.12.3",
    "pydantic-ai-slim[google,openai,mcp]>=1.47.0",
    "python-dotenv>=1.2.1",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.20",
    "sqlalchemy>=2.0.44",
    "uvicorn>=0.38.0",
    "watchdog>=6.0.0",
]

[dependency-groups]
dev = [
    "grpcio-tools>=1.76.0",
    "pyinstaller>=6.0.0",
]
