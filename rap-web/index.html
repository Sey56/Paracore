<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Paracore</title>
    <style>
      @keyframes pc-boot-spin { to { transform: rotate(360deg); } }
      #pc-boot-splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #64748b; }
      #pc-boot-splash .pc-boot-ring { width: 22px; height: 22px; border: 2px solid #e2e8f0; border-top-color: #2563eb; border-radius: 50%; animation: pc-boot-spin 0.8s linear infinite; }
      #pc-boot-splash .pc-boot-label { font-size: 12px; letter-spacing: 0.02em; }
    </style>

    <!-- Google Analytics: Anonymous startup ping (no personal data) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-S0HPL5M96G"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-S0HPL5M96G', {
        send_page_view: true,
        page_title: 'Paracore App',
        page_location: 'https://app.paracore.dev',
        cookie_flags: 'SameSite=None;Secure'
      });
    </script>

    <!-- UI font is self-hosted in main.tsx; no network font dependency. -->
  </head>
  <body>
    <a href="#main-content" class="skip-to-content">Skip to content</a>
    <div id="root">
      <div id="pc-boot-splash">
        <div class="pc-boot-ring"></div>
        <div class="pc-boot-label">Starting Paracore...</div>
      </div>
    </div>
    <div id="portal-wrapper"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
