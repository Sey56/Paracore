syntax = "proto3";

package CoreScript;

service CoreScriptRunner {
  rpc ExecuteScript (ExecuteScriptRequest) returns (ExecuteScriptResponse);
  rpc GetStatus (GetStatusRequest) returns (GetStatusResponse);
  rpc GetScriptMetadata (GetScriptMetadataRequest) returns (GetScriptMetadataResponse);
  rpc GetScriptParameters (GetScriptParametersRequest) returns (GetScriptParametersResponse);
  rpc GetCombinedScript (GetCombinedScriptRequest) returns (GetCombinedScriptResponse);
  rpc GetBulkMetadata (GetBulkMetadataRequest) returns (GetBulkMetadataResponse);
  rpc GetContext (GetContextRequest) returns (GetContextResponse);
  rpc CreateAndOpenWorkspace (CreateWorkspaceRequest) returns (CreateWorkspaceResponse);
  rpc GetScriptManifest (GetScriptManifestRequest) returns (GetScriptManifestResponse);
  rpc ValidateWorkingSet (ValidateWorkingSetRequest) returns (ValidateWorkingSetResponse);
  rpc ComputeParameterOptions (ComputeParameterOptionsRequest) returns (ComputeParameterOptionsResponse);
  rpc SelectElements (SelectElementsRequest) returns (SelectElementsResponse);
  rpc PickObject (PickObjectRequest) returns (PickObjectResponse);
  rpc RenameScript (RenameScriptRequest) returns (RenameScriptResponse);
  rpc BuildScript (BuildScriptRequest) returns (BuildScriptResponse);
  rpc GetCategoryParameters (GetCategoryParametersRequest) returns (GetCategoryParametersResponse);
  rpc GetModelCategories (GetModelCategoriesRequest) returns (GetModelCategoriesResponse);
  rpc StopSyncSession (StopSyncSessionRequest) returns (StopSyncSessionResponse);
  rpc GetWatchdogStatus (GetWatchdogStatusRequest) returns (GetWatchdogStatusResponse);
  rpc RegisterWatchdogSource (RegisterWatchdogSourceRequest) returns (RegisterWatchdogSourceResponse);
  rpc UnregisterWatchdogSource(UnregisterWatchdogSourceRequest) returns (UnregisterWatchdogSourceResponse);
  rpc UpdateElementParameter (UpdateElementParameterRequest) returns (UpdateElementParameterResponse);
  // New V4 Data Grid Feature: Mass Single-Transaction Edit
  rpc BatchUpdateElementParameters(BatchUpdateElementParametersRequest) returns (BatchUpdateElementParametersResponse);
  rpc ClearAssemblyCache (ClearAssemblyCacheRequest) returns (ClearAssemblyCacheResponse);
  rpc ExecuteRepl (ExecuteReplRequest) returns (ExecuteReplResponse);
}

message ClearAssemblyCacheRequest {}

message ClearAssemblyCacheResponse {
  bool is_success = 1;
  string message = 2;
}

message UnregisterWatchdogSourceRequest {
  string path = 1;
}

message UnregisterWatchdogSourceResponse {
  bool is_success = 1;
  string error_message = 2;
  int32 watchdogs_removed = 3;
}

message RegisterWatchdogSourceRequest {
  string path = 1;
  bytes parameters_json = 2;
}

message RegisterWatchdogSourceResponse {
  bool is_success = 1;
  string error_message = 2;
  int32 watchdogs_registered = 3;
  repeated string load_details = 4;
}

message GetWatchdogStatusRequest {}

message WatchdogStatus {
  string script_path = 1;
  string script_name = 2;
  string summary = 3;
  string status = 4;
  string details_json = 5;
  string timestamp = 6;
  string parameters_json = 7;
}

message FailedWatchdog {
  string script_path = 1;
  string script_name = 2;
  string error_message = 3;
  string timestamp = 4;
}

message GetWatchdogStatusResponse {
  repeated WatchdogStatus watchdogs = 1;
  repeated FailedWatchdog failed_watchdogs = 2;
}

message StopSyncSessionRequest {
  string script_path = 1;
}

message StopSyncSessionResponse {
  bool is_success = 1;
  string error_message = 2;
}

message GetCategoryParametersRequest {
  string category_name = 1; 
}

message ParameterDefinition {
  string name = 1;
  string storage_type = 2; 
  bool is_builtin = 3;
  int32 builtin_id = 4; 
  string revit_element_type = 5; 
  string builtin_name = 6;
  string spec_type_id = 7;
  bool is_type = 8;
}

message GetCategoryParametersResponse {
  repeated ParameterDefinition parameters = 1;
  string error_message = 2;
}

message GetModelCategoriesRequest {}

message GetModelCategoriesResponse {
  repeated CategoryInfo categories = 1;
  string error_message = 2;
}

message CategoryInfo {
  string id = 1;
  string label = 2;
}

message PickObjectRequest {
  string selection_type = 1; 
  string category_filter = 2; 
}

message PickObjectResponse {
  string value = 1; 
  bool is_success = 2;
  bool cancelled = 3;
  string error_message = 4;
}

message SelectElementsRequest {
  repeated int64 element_ids = 1;
}

message SelectElementsResponse {
  bool is_success = 1;
  string error_message = 2;
}

message CreateWorkspaceRequest {
  string script_path = 1;
}

message CreateWorkspaceResponse {
  string workspace_path = 1;
  string error_message = 2;
}

message ScriptFile {
  string file_name = 1;
  string content = 2;
}

message ExecuteScriptRequest {
  string script_content = 1;
  bytes parameters_json = 2;
  string source = 3;
  bytes compiled_assembly = 4; 
}

message StructuredOutputItem {
  string type = 1;
  string data = 2; 
}

message ExecuteScriptResponse {
  bool is_success = 1;
  string output = 2;
  string error_message = 3;
  repeated string error_details = 4;
  repeated StructuredOutputItem structured_output = 5;
  string internal_data = 6;
  string agent_summary = 7;
}

message GetStatusRequest {
}

message GetStatusResponse {
  bool paracore_connected = 1;
  bool revit_open = 2;
  string revit_version = 3;
  bool document_open = 4;
  string document_title = 5;
  string document_type = 6;
  string revit_install_path = 7;
  string addin_server_path = 8;
}

message GetScriptMetadataRequest {
  repeated ScriptFile script_files = 1;
}

message GetScriptMetadataResponse {
  ScriptMetadata metadata = 1;
  string error_message = 2;
}

message GetScriptParametersRequest {
  repeated ScriptFile script_files = 1;
}

message ScriptMetadata {
  string name = 1;                  
  string file_path = 2;             
  string description = 4;
  string author = 5;
  repeated string categories = 6;
  repeated string dependencies = 7;
  string document_type = 8;
  repeated string usage_examples = 9;        
  string website = 10; 
  string last_run = 11;
  bool is_protected = 12;           
  bool is_compiled = 13;            
  bool is_watchdog = 14;
  string date_created = 15;
  string date_modified = 16;
}


message GetScriptParametersResponse {
  repeated ScriptParameter parameters = 1;
  string error_message = 2;
}

message ScriptParameter {
  string name = 1;
  string type = 2;
  string default_value_json = 3;
  string description = 4;
  repeated string options = 5;
  bool multi_select = 6;
  string visible_when = 7;
  
  string numeric_type = 8;  
  optional double min = 9;
  optional double max = 10;
  optional double step = 11;
  
  bool is_revit_element = 12;
  string revit_element_type = 13;
  string revit_element_category = 14;
  bool requires_compute = 15;
  string group = 16;
  string input_type = 17;
  bool required = 18;
  string suffix = 19;
  string pattern = 20;
  string enabled_when_param = 21;
  string enabled_when_value = 22;
  string unit = 23;
  string selection_type = 24;
}

message GetBulkMetadataRequest {
  repeated ScriptProjectFiles projects = 1;
}

message ScriptProjectFiles {
  string project_name = 1;
  string absolute_path = 2;
  repeated ScriptFile files = 3;
}

message GetBulkMetadataResponse {
  repeated ScriptMetadataResponse project_metadata = 1;
}

message ScriptMetadataResponse {
  string project_name = 1;
  string absolute_path = 2;
  ScriptMetadata metadata = 3;
  repeated ScriptParameter parameters = 4;
  string error_message = 5;
}

message GetCombinedScriptRequest {
  repeated ScriptFile script_files = 1;
  string script_path = 2; 
}

message GetCombinedScriptResponse {
  string combined_script = 1;
  string error_message = 2;
}

message GetContextRequest {}

message GetContextResponse {
  string active_view_name = 1;
  int32 selection_count = 2;
  repeated int32 selected_element_ids = 3;
  ProjectInfo project_info = 4;
  string active_view_type = 5;
  int32 active_view_scale = 6;
  string active_view_detail_level = 7;
  repeated ElementInfo selected_elements = 8;
  repeated LevelInfo levels = 9;
}

message LevelInfo {
  int32 id = 1;
  string name = 2;
  double elevation = 3;
}

message ElementInfo {
  int32 id = 1;
  string category = 2;
}

message ProjectInfo {
  string name = 1;
  string number = 2;
  string title = 3;
  string file_path = 4;
  bool is_workshared = 5;
  string username = 6;
}

message GetScriptManifestRequest {
  string script_path = 1;
}

message GetScriptManifestResponse {
  string manifest_json = 1;
  string error_message = 2;
}

message ValidateWorkingSetRequest {
  repeated int64 element_ids = 1;
}

message ValidateWorkingSetResponse {
  repeated int64 valid_element_ids = 1;
}

message ComputeParameterOptionsRequest {
  string script_content = 1;
  string parameter_name = 2;
  bytes parameters_json = 3;
}

message ComputeParameterOptionsResponse {
  repeated string options = 1;
  bool is_success = 2;
  string error_message = 3;
  
  optional double min = 4;
  optional double max = 5;
  optional double step = 6;
}

message RenameScriptRequest {
  string old_path = 1;       
  string new_name = 2;       
}

message RenameScriptResponse {
  bool is_success = 1;
  string new_path = 2;       
  string error_message = 3;
}

message BuildScriptRequest {
  string script_content = 1;
}

message BuildScriptResponse {
  bool is_success = 1;
  bytes compiled_assembly = 2;
  string error_message = 3;
}

message ParameterUpdateItem {
  int32 element_id = 1;
  string parameter_name = 2;
  string new_value_string = 3;
  string unit = 4;
}

message BatchUpdateElementParametersRequest {
  repeated ParameterUpdateItem updates = 1;
}

message BatchUpdateElementParametersResponse {
  bool is_success = 1;
  string error_message = 2;
  int32 count = 3;
}

message UpdateElementParameterRequest {
  int64 element_id = 1;
  string parameter_name = 2;
  string new_value_string = 3;
  string unit = 4;
}

message UpdateElementParameterResponse {
  bool is_success = 1;
  string error_message = 2;
}

message ExecuteReplRequest {
  string code = 1;
  string session_id = 2;
}

message ExecuteReplResponse {
  bool is_success = 1;
  string output = 2;
  string error_message = 3;
  repeated StructuredOutputItem structured_output = 4;
}
